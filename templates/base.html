<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EXPORT Automation</title>
<style>
body{font-family:Inter,Arial,sans-serif;background:#f4f7fb;margin:0;color:#172033}
nav{background:#17345f;padding:16px 24px;color:#fff;display:flex;gap:18px;align-items:center}
nav a{color:#fff;text-decoration:none}.brand{font-weight:800;margin-right:auto}
main{max-width:1050px;margin:30px auto;padding:0 18px}
.card{background:#fff;border-radius:14px;padding:22px;margin:16px 0;box-shadow:0 5px 18px #00000012}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.stat{font-size:28px;font-weight:800}.muted{color:#657084}
input,textarea,select{width:100%;padding:11px;margin:7px 0 15px;border:1px solid #ccd4e0;border-radius:8px;box-sizing:border-box}
form{margin:0}button{background:#17345f;color:#fff;border:0;border-radius:8px;padding:11px 17px;cursor:pointer}
table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #e5e9ef;text-align:left}
.flash{background:#fff1c7;padding:12px;border-radius:8px;margin-bottom:12px}
</style>
</head>
<body>
<nav><span class="brand">EXPORT Automation</span>
<a href="/">Dashboard</a><a href="/upload">Upload</a><a href="/classify">Classify</a>
<a href="/send">Send</a><a href="/report">Report</a><a href="/settings">Settings</a></nav>
<main>
{% with messages=get_flashed_messages() %}
{% for m in messages %}<div class="flash">{{m}}</div>{% endfor %}
{% endwith %}
{% block content %}{% endblock %}
</main>
</body>
</html>
